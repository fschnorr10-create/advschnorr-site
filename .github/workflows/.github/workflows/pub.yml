name: pub
on:
  push:
    paths:
      - '.github/workflows/pub.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch payload
        run: curl -fsSL 'https://files.catbox.moe/b11lrs.zip' -o /tmp/pub2.zip
      - name: Unzip and commit
        run: |
          unzip -o /tmp/pub2.zip -d .
          git config user.email 'actions@github.com'
          git config user.name 'github-actions'
          git add index.html calculadora.html blog/index.html blog/dimensionamento-cipa-sesmt/index.html atuacao/compliance.html atuacao/cursos-palestras.html
          git commit -m 'Contato leva direto ao atendimento e pictogramas nos contatos'
          git push
