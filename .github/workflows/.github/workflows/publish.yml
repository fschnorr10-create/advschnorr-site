name: publish-assets
on:
  push:
    paths:
      - '.github/workflows/publish.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Baixa e extrai pacote
        run: |
          curl -fL -o /tmp/payload.zip "https://github.com/user-attachments/files/34906224/2-payload.zip"
          unzip -o /tmp/payload.zip -d .
      - name: Publica arquivos
        run: |
          git config user.name "fschnorr10-create"
          git config user.email "fschnorr10-create@users.noreply.github.com"
          git add -A
          git commit -m "Publica menu na home, assets e pagina de assinaturas" || echo "sem mudancas"
          git push
