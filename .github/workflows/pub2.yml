name: pub
on: [push]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://files.catbox.moe/tqvruq.zip -o /tmp/p.zip && unzip -o /tmp/p.zip -d .
      - run: |
          git config user.name "fschnorr10-create"
          git config user.email "fschnorr10-create@users.noreply.github.com"
          git add blog assets/aquarelas
          git commit -m "Blog: post licenca-paternidade (Lei 15.371/2026) + aquarela"
          git push
