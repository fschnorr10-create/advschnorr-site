name: pub2
on:
  push:
    paths:
      - '.github/workflows/pub2.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch payload
        run: curl -fsSL 'https://files.catbox.moe/hnrojz.zip' -o /tmp/blog.zip
      - name: Unzip and commit
        run: |
          unzip -o /tmp/blog.zip -d .
          git config user.email 'actions@github.com'
          git config user.name 'github-actions'
          git add -A
          git commit -m 'Menu: link da Amazon no ebook Compliance Trabalhista'
          git push
