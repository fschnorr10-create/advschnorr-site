name: pub
on: [push]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o _pub/1-5x2-upload.zip -d . && rm -rf _pub
      - run: |
          git config user.name "fschnorr10-create"
          git config user.email "fschnorr10-create@users.noreply.github.com"
          git add -A
          git commit -m "Site: troca destino do Guia Pratico da Escala 5x2 no Drive"
          git push
