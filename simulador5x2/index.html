:"2 hours"},"O motor desconta pausas da cobertura: 15min nas jornadas acima de 4h até 6h; intervalo selecionado acima de 6h. No rural, validar também os usos locais e a norma coletiva.":{es:"El motor descuenta pausas de la cobertura: 15min para jornadas de más de 4h hasta 6h; la pausa seleccionada para más de 6h. En el campo, valide también los usos locales y la norma colectiva.",en:"The engine deducts breaks from coverage: 15min for working days over 4h and up to 6h; the selected break for days over 6h. For rural work, also validate local practices and the collective agreement."},"Condições e premissas":{es:"Condiciones y supuestos",en:"Conditions and assumptions"},"Há ACT/CCT aplicável à organização da jornada?":{es:"¿Hay ACT/CCT aplicable a la organización de la jornada?",en:"Is there an ACT/CCT applicable to working time arrangements?"},"Ainda não conferi":{es:"Aún no lo he verificado",en:"Not checked yet"},"Sim · verificar conteúdo e vigência":{es:"Sí · verificar contenido y vigencia",en:"Yes · check terms and validity"},Não:{es:"No",en:"No"},"Referência do instrumento":{es:"Referencia del instrumento",en:"Agreement reference"},"Número, vigência e cláusula":{es:"Número, vigencia y cláusula",en:"Number, validity period and clause"},"Há atividade insalubre ou exposição a verificar":{es:"Hay actividad insalubre o exposición por verificar",en:"Unhealthy work or exposure requires assessment"},"Operação vinculada a contrato administrativo":{es:"Operación vinculada a contrato administrativo",en:"Operation linked to a public administration contract"},"Ajustar premissas de custo":{es:"Ajustar supuestos de coste",en:"Adjust cost assumptions"},"Adicional de HE":{es:"Recargo por horas extras",en:"Overtime premium"},"Reflexo DSR":{es:"Repercusión en DSR",en:"Paid weekly rest (DSR) effect"},"Fator mensal das horas semanais":{es:"Factor mensual de las horas semanales",en:"Monthly factor for weekly hours"},"5 · aproximação usada na referência CNC":{es:"5 · aproximación usada e "},ETAPA:{es:"ETAPA",en:"STAGE"},"16 DEZ 2026":{es:"16 DIC 2026",en:"16 DEC 2026"},"16 DEZ 2027":{es:"16 DIC 2027",en:"16 DEC 2027"},"Até 8h24/dia · regra transitória¹":{es:"Hasta 8h24/día · regla transitoria¹",en:"Up to 8h24/day · transitional rule¹"},"Até 8h/dia · modelo padrão":{es:"Hasta 8h/día · modelo estándar",en:"Up to 8h/day · standard model"},"Duas folgas na semana":{es:"Dos descansos semanales",en:"Two days off per week"},"Horas contratadas a menos":{es:"Menos horas contratadas",en:"Reduction in contracted hours"},"/sem":{es:"/sem",en:"/wk"},"Lacuna na sugestão":{es:"Brecha en la sugerencia",en:"Gap in suggested schedule"},"Valor da hora normal":{es:"Valor de la hora ordinaria",en:"Regular hourly rate"},"Divisor de referência²":{es:"Divisor de referencia²",en:"Reference divisor²"},"Etapa em visualização":{es:"Etapa en visualización",en:"Currently displayed stage"},"Visualizar esta etapa":{es:"Ver esta etapa",en:"View this stage"},"¹ Na ausência de ACT/CCT celebrado até 15/12/2026, a cautelar admite 8h24 sem adicional pelos 24min, na etapa intermediária. Se houver instrumento, conferir suas cláusulas. Jornadas menores são preservadas. ² Premissa de mensalista comum; divisores especiais exigem revisão.":{es:"¹ En ausencia de ACT/CCT celebrado hasta el 15/12/2026, la cautelar permite 8h24 sin recargo por los 24min durante la etapa intermedia. Si hay acuerdo, revise sus cláusulas. Se preservan las jornadas menores. ² Supuesto de trabajador mensual común; los divisores especiales requieren revisión.",en:"¹ In the absence of an ACT/CCT signed by 15 Dec 2026, the interim ruling allows 8h24 without a premium for the 24min during the intermediate stage. If an agreement exists, review its clauses. Shorter working weeks are preserved. ² Assumes an ordinary monthly paid employee; special divisors require review."},"PLANEJAMENTO FINANCEIRO":{es:"PLANIFICACIÓN FINANCIERA",en:"FINANCIAL PLANNING"},"Quanto custa cada caminho?":{es:"¿Cuánto cuesta cada opción?",en:"How much does each option cost?"},"Adicional mensal estimado":{es:"Coste mensual adicional estimado",en:"Estimated additional monthly cost"},Caminho:{es:"Opción",en:"Option"},"/ semana":{es:"/ semana",en:"/ week"},"Reorganizar a equipe":{es:"Reorganizar el equipo",en:"Reorganize the team"},"Primeira medida · não elimina lacunas automaticamente":{es:"Primera medida · no elimina brechas automáticamente",en:"First step · does not automatically eliminate gaps"},"Sem custo direto":{es:"Sin coste directo",en:"No direct cost"},"ainda descobertas":{es:"aún sin cobertura",en:"still uncovered"},"Nova contratação parcial":{es:"Nueva contratación a tiempo parcial",en:"New part-time hiring"},"Equivalência econômica · até 30h por contrato":{es:"Equivalencia económica · hasta 30h por contrato",en:"Economic equivalent · up to 30h per contract"},"Sem lacuna na sugestão":{es:"Sin brecha en la sugerencia",en:"No gap in the suggestion"},"Nova contratação integral":{es:"Nueva contratación a tiempo completo",en:"New full-time hiring"},"Arredondamento para postos inteiros":{es:"Redondeo a puestos completos",en:"Rounded up to whole positions"},"contratação(ões)":{es:"contratación(es)",en:"hire(s)"},"Horas extras":{es:"Horas extras",en:"Overtime"},"Referência de custo · viabilidade não validada":{es:"Referencia de coste · viabilidad no validada",en:"Cost reference · feasibility not validated"},"/mês estimadas":{es:"/mes estimadas",en:"/month estimated"},"Comparação visual de custos da etapa selecionada":{es:"Comparación visual de costes de la etapa seleccionada",en:"Visual cost comparison for the selected stage"},"Custos não garantem cobertura nos horários descobertos. Novos contratos devem respeitar piso, benefícios e regras aplicáveis. HE depende de limites, repousos e autorização; não substitui a segunda folga. Encargos de":{es:"Los costes no garantizan la cobertura de las franjas descubiertas. Los nuevos contratos deben respetar el salario mínimo aplicable, beneficios y reglas pertinentes. Las horas extras dependen de límites, descansos y autorización; no sustituyen el segundo descanso. Cargas del",en:"Costs do not guarantee coverage of unstaffed times. New contracts must comply with applicable wage floors, benefits and rules. Overtime depends on limits, rest and authorization; it does not replace the second day off. Payroll charges of"},"%, HE de":{es:"%, horas extras del",en:"%, overtime premium of"},"%, DSR de":{es:"%, DSR del",en:"%, DSR of"},"% e fator mensal":{es:"% y factor mensual",en:"% and monthly factor"},HORAS:{es:"HORAS",en:"HOURS"},"Cobertura, hora a hora":{es:"Cobertura, hora a hora",en:"Coverage, hour by hour"},"% coberta":{es:"% cubierta",en:"% covered"},cobertas:{es:"cubiertas",en:"covered"},descobertas:{es:"sin cobertura",en:"uncovered"},demandadas:{es:"requeridas",en:"required"},"Cobertura por dia e hora":{es:"Cobertura por día y hora",en:"Coverage by day and hour"},Coberto:{es:"Cubierto",en:"Covered"},Parcial:{es:"Parcial",en:"Partial"},Descoberto:{es:"Sin cobertura",en:"Uncovered"},"Sem demanda":{es:"Sin demanda",en:"No demand"},"Cada célula resume 60 minutos. Passe o cursor ou use o teclado para consultar horas-pessoa. As pausas são descontadas minuto a minuto, inclusive após meia-noite.":{es:"Cada celda resume 60 minutos. Pase el cursor o use el teclado para consultar horas-persona. Las pausas se descuentan minuto a minuto, incluso después de medianoche.",en:"Each cell summarizes 60 minutes. Hover or use the keyboard to check person-hours. Breaks are deducted minute by minute, including after midnight."},"PROPOSTA DE ORGANIZAÇÃO":{es:"PROPUESTA DE ORGANIZACIÓN",en:"ORGANIZATION PROPOSAL"},"A escala da sua equipe":{es:"El horario de su equipo",en:"Your team’s schedule"},"Sugestão automática":{es:"Sugerencia automática",en:"Automatic suggestion"},Até:{es:"Hasta",en:"Up to"},"de trabalho por dia e":{es:"de trabajo por día y",en:"of work per day and"},"h por semana. Intervalo fora da jornada. Horários com “+1” terminam no dia seguinte.":{es:"h por semana. Pausa fuera de la jornada. Los horarios con “+1” terminan al día siguiente.",en:"h per week. Breaks excluded from working hours. Times with “+1” end the next day."},Empregado:{es:"Empleado",en:"Employee"},Semana:{es:"Semana",en:"Week"},"Sem intervalo obrigatório":{es:"Sin pausa obligatoria",en:"No mandatory break"},"Folga / não alocado":{es:"Descanso / sin asignación",en:"Day off / unassigned"},"Mostrar menos":{es:"Mostrar menos",en:"Show less"},"✓ Máximo de cinco dias de início de jornada":{es:"✓ Máximo de cinco días de inicio de jornada",en:"✓ At most five days on which shifts start"},"✓ Descanso entre jornadas ≥ 11h":{es:"✓ Descanso entre jornadas ≥ 11h",en:"✓ Rest between shifts ≥ 11h"},"✓ Uma janela de descanso ≥ 35h no ciclo":{es:"✓ Un período de descanso ≥ 35h en el ciclo",en:"✓ One rest window ≥ 35h in the cycle"},"✓ Limites diário e semanal do modelo":{es:"✓ Límites diario y semanal del modelo",en:"✓ Model daily and weekly limits"},"O motor usa busca heurística e duas folgas consecutivas. Não prova que a lacuna seja inevitável: outras escalas podem melhorar a cobertura. Folgas e repousos em turnos noturnos, domingos, feriados, pausas de SST e regras específicas precisam de revisão. “Não alocado” não indica redução salarial.":{es:"El motor utiliza una búsqueda heurística y dos descansos consecutivos. No demuestra que la brecha sea inevitable: otros horarios pueden mejorar la cobertura. Los descansos en turnos nocturnos, domingos, festivos, pausas de SST y reglas específicas requieren revisión. “Sin asignación” no indica reducción salarial.",en:"The engine uses a heuristic search and two consecutive days off. It does not prove the gap is unavoidable: other schedules may improve coverage. Rest during night shifts, Sundays, holidays, occupational safety breaks and specific rules require review. “Unassigned” does not indicate a salary reduction."},"Como interpretar os resultados":{es:"Cómo interpretar los resultados",en:"How to interpret the results"},"Redução da capacidade contratada":{es:"Reducción de la capacidad contratada",en:"Reduction in contracted capacity"},"Déficit mínimo por volume de horas":{es:"Déficit mínimo por volumen de horas",en:"Minimum shortfall by total hours"},"Lacuna da escala proposta":{es:"Brecha del horario propuesto",en:"Gap in the proposed schedule"},"Capacidade semanal não equivale a disponibilidade simultânea. A escala atual não foi reconstruída; a diferença contratual usa apenas a jornada informada. Se a operação já demanda mais do que a equipe oferece hoje, o problema antecede a mudança.":{es:"La capacidad semanal no equivale a disponibilidad simultánea. No se reconstruyó el horario actual; la diferencia contractual utiliza solo la jornada indicada. Si la operación ya requiere más de lo que ofrece el equipo hoy, el problema es anterior al cambio.",en:"Weekly capacity is not the same as simultaneous availability. The current schedule was not reconstructed; the contractual difference uses only the entered working hours. If the operation already needs more than the team can currently provide, the problem predates the change."},"BASE LEGAL · CONFERÊNCIA EM 15/11/2026":{es:"BASE LEGAL · VERIFICADA EL 15/11/2026",en:"LEGAL BASIS · CHECKED ON 15 NOV 2026"},"O que mudou com a cautelar":{es:"Qué cambió con la cautelar",en:"What the interim ruling changed"},"EC 141/2026 e decisão de 12/11/2026, nas ADIs 8041 e 8042. O cronograma foi mantido. A referência da CNC é útil para planejamento, mas precisa ser lida com a decisão posterior.":{es:"EC 141/2026 y decisión del 12/11/2026, en las ADI 8041 y 8042. Se mantuvo el calendario. La referencia de la CNC es útil para planificar, pero debe leerse junto con la decisión posterior.",en:"EC 141/2026 and the ruling of 12 Nov 2026 in ADIs 8041 and 8042. The timeline was maintained. The CNC reference is useful for planning, but must be read alongside the later ruling."},"Cautelar com eficácia imediata, sujeita a referendo.":{es:"Medida cautelar de eficacia inmediata, sujeta a ratificación.",en:"Interim ruling with immediate effect, subject to confirmation."},"O processo foi destacado do julgamento virtual pelo ministro Luiz Fux em 14/11/2026. O referendo não é tratado aqui como encerrado. Esta versão não faz atualização jurídica automática.":{es:"El ministro Luiz Fux retiró el proceso del juicio virtual el 14/11/2026. Aquí no se considera concluida la ratificación. Esta versión no realiza actualizaciones jurídicas automáticas.",en:"Justice Luiz Fux removed the case from the virtual hearing on 14 Nov 2026. Confirmation is not treated here as concluded. This version does not automatically update legal information."},"Andamento oficial":{es:"Seguimiento oficial",en:"Official case status"},"ATÉ 15/12/2026":{es:"HASTA EL 15/12/2026",en:"UNTIL 15 DEC 2026"},Preparação:{es:"Preparación",en:"Preparation"},"Revisar instrumentos coletivos, demanda, contratos e folha.":{es:"Revisar acuerdos colectivos, demanda, contratos y nómina.",en:"Review collective agreements, demand, contracts and payroll."},"42 horas":{es:"42 horas",en:"42 hours"},"Início da etapa intermediária e dos dois repousos.":{es:"Inicio de la etapa intermedia y de los dos descansos.",en:"Start of the intermediate stage and two rest days."},"40 horas":{es:"40 horas",en:"40 hours"},"Etapa definitiva da redução semanal.":{es:"Etapa definitiva de la reducción semanal.",en:"Final stage of the weekly hours reduction."},"01 / JORNADA":{es:"01 / JORNADA",en:"01 / WORKING HOURS"},"8h24 na transição":{es:"8h24 en la transición",en:"8h24 during the transition"},"Sem ACT/CCT celebrado até 15/12/2026, a cautelar permite 42h em cinco dias de 8h24, até 15/12/2027, sem adicional pelos 24min excedentes. Isso não é autorização geral de sobrejornada.":{es:"Sin ACT/CCT celebrado hasta el 15/12/2026, la cautelar permite 42h en cinco días de 8h24, hasta el 15/12/2027, sin recargo por los 24min excedentes. No constituye una autorización general de horas extras.",en:"Without an ACT/CCT signed by 15 Dec 2026, the interim ruling allows 42h over five days of 8h24 until 15 Dec 2027, without a premium for the extra 24min. This is not a general authorization for overtime."},"Explicação oficial do STF":{es:"Explicación oficial del STF",en:"Official STF explanation"},"02 / NEGOCIAÇÃO":{es:"02 / NEGOCIACIÓN",en:"02 / NEGOTIATION"},"Contrapartidas coletivas":{es:"Contrapartidas colectivas",en:"Collectively agreed benefits"},"Há 90 dias desde 16/12/2026 para renegociação. Cláusulas incompatíveis perdem eficácia, mas a falta de novo pacto não permite retirar contrapartidas unilateralmente.":{es:"Hay 90 días desde el 16/12/2026 para renegociar. Las cláusulas incompatibles pierden eficacia, pero la falta de un nuevo acuerdo no permite retirar contrapartidas unilateralmente.",en:"There are 90 days from 16 Dec 2026 to renegotiate. Incompatible clauses cease to have effect, but the lack of a new agreement does not allow benefits to be withdrawn unilaterally."},"Dispositivo, item II":{es:"Parte dispositiva, apartado II",en:"Operative provisions, item II"},"03 / REPOUSOS":{es:"03 / DESCANSOS",en:"03 / REST DAYS"},"Compensar exige condições":{es:"La compensación exige condiciones",en:"Compensation requires conditions"},"A fruição pode ser ajustada por ACT/CCT, preservando ambos os repousos. Portaria subsidiária foi apenas admitida sob condições; o sistema não presume sua edição.":{es:"El disfrute puede ajustarse por ACT/CCT, preservando ambos descansos. Solo se admitió una orden ministerial subsidiaria bajo ciertas condiciones; el sistema no presume su publicación.",en:"Rest arrangements may be adjusted by ACT/CCT while preserving both rest days. A supplementary ministerial ordinance was only allowed subject to conditions; the system does not assume it has been issued."},"Dispositivo, item IV":{es:"Parte dispositiva, apartado IV",en:"Operative provisions, item IV"},"04 / CONTRATO PÚBLICO":{es:"04 / CONTRATO PÚBLICO",en:"04 / PUBLIC CONTRACT"},"Prazo de adaptação":{es:"Plazo de adaptación",en:"Adaptation period"},"180 dias desde a publicação da emenda para contratos vigentes; nas licitações então em andamento, desde a assinatura. Conferir o enquadramento e o reequilíbrio.":{es:"180 días desde la publicación de la enmienda para contratos vigentes; en las licitaciones entonces en curso, desde la firma. Verifique el encuadramiento y el reequilibrio.",en:"180 days from publication of the amendment for existing contracts; for procurement then in progress, from signature. Check applicability and contractual rebalancing."},"Dispositivo, item VII":{es:"Parte dispositiva, apartado VII",en:"Operative provisions, item VII"},"Salário e jornadas menores":{es:"Salarios y jornadas menores",en:"Salaries and shorter working weeks"},"A redução não permite cortar salários ou pisos. Quem já tem jornada de 40h ou menos não recebe uma redução automática proporcional. O motor preserva a jornada menor informada, inclusive na comparação das duas etapas.":{es:"La reducción no permite recortar salarios ni salarios mínimos aplicables. Quien ya trabaja 40h o menos no recibe una reducción proporcional automática. El motor preserva la jornada menor indicada, incluso al comparar ambas etapas.",en:"The reduction does not permit cuts to salaries or applicable wage floors. Those already working 40h or less do not receive an automatic proportional reduction. The engine preserves the shorter working week entered, including when comparing both stages."},"EC 141/2026, arts. 2º e 4º":{es:"EC 141/2026, arts. 2 y 4",en:"EC 141/2026, articles 2 and 4"},"Exceções não são aplicadas automaticamente":{es:"Las excepciones no se aplican automáticamente",en:"Exceptions are not applied automatically"},"12×36, turnos, regimes diferenciados e trabalhadores alcançados pelo art. 8º exigem enquadramento próprio. O sistema não presume dispensa de controle de jornada por cargo, diploma ou remuneração. Tampouco presume uma exclusão geral para micro e pequenas empresas.":{es:"12×36, turnos, regímenes diferenciados y trabajadores comprendidos en el art. 8 requieren un encuadramiento propio. El sistema no presume exención del control horario por cargo, título o remuneración. Tampoco presume una exclusión general para microempresas y pequeñas empresas.",en:"12×36, shifts, special arrangements and workers covered by article 8 require their own assessment. The system does not assume exemption from time tracking based on role, degree or pay. It also does not assume a blanket exclusion for micro and small businesses."},"Consultar a emenda":{es:"Consultar la enmienda",en:"Read the amendment"},"LIMITES E DIREITOS":{es:"LÍMITES Y DERECHOS",en:"LIMITS AND RIGHTS"},"O que conferir antes de adotar a escala":{es:"Qué verificar antes de adoptar el horario",en:"What to check before adopting the schedule"},"Horas extras e banco de horas":{es:"Horas extras y banco de horas",en:"Overtime and time banks"},"Em regra, até duas horas extras por dia. Banco anual exige negociação coletiva; semestral, acordo individual escrito; compensação no mesmo mês pode ser ajustada individualmente. As regras de repouso da reforma exigem análise própria.":{es:"Por regla general, hasta dos horas extras al día. El banco anual requiere negociación colectiva; el semestral, acuerdo individual escrito; la compensación en el mismo mes puede pactarse individualmente. Las reglas de descanso de la reforma requieren un análisis propio.",en:"Generally, up to two overtime hours per day. An annual time bank requires collective bargaining; a six-month bank requires a written individual agreement; compensation within the same month may be agreed individually. The reform’s rest rules require their own assessment."},"Ambiente insalubre":{es:"Ambiente insalubre",en:"Unhealthy working environment"},"Prorrogação exige exame do art. 60 e do art. 611-A, XIII, da CLT. Para a via coletiva, conferir autorização expressa em ACT/CCT. A seleção de “sim” no formulário não valida a cláusula nem afasta exigências de SST.":{es:"La prórroga requiere examinar el art. 60 y el art. 611-A, XIII, de la CLT. Por la vía colectiva, verifique la autorización expresa en ACT/CCT. Seleccionar “sí” en el formulario no valida la cláusula ni elimina los requisitos de SST.",en:"Extended hours require examination of CLT articles 60 and 611-A, XIII. For the collective route, check express authorization in an ACT/CCT. Selecting “yes” in the form does not validate the clause or remove occupational health and safety requirements."},"Serviço extraordinário":{es:"Servicio extraordinario",en:"Exceptional services"},"Necessidade imperiosa, força maior e serviços inadiáveis têm disciplina própria no art. 61. Um pico habitual de demanda não basta para presumir a exceção. O motor não cria essa autorização.":{es:"La necesidad imperiosa, la fuerza mayor y los servicios inaplazables tienen reglas propias en el art. 61. Un pico habitual de demanda no basta para presumir la excepción. El motor no crea esa autorización.",en:"Urgent necessity, force majeure and non-deferrable services have their own rules under article 61. A routine demand peak is not enough to assume an exception. The engine does not create such authorization."},"Remuneração e reflexos":{es:"Remuneración y repercusiones",en:"Pay and related effects"},"Horas extras e parcelas salariais podem repercutir em DSR, férias, 13º e FGTS conforme sua natureza e habitualidade. A estimativa não liquida essas verbas nem substitui a folha.":{es:"Las horas extras y conceptos salariales pueden repercutir en DSR, vacaciones, 13.º salario y FGTS según su naturaleza y habitualidad. La estimación no liquida esos conceptos ni sustituye la nómina.",en:"Overtime and salary components may affect paid weekly rest (DSR), holidays, the 13th-month salary and FGTS depending on their nature and regularity. The estimate does not settle these amounts or replace payroll."},"CLT · arts. 59 a 61, 66, 67, 71 e 611-A":{es:"CLT · arts. 59 a 61, 66, 67, 71 y 611-A",en:"CLT · articles 59–61, 66, 67, 71 and 611-A"},"Fontes consultadas":{es:"Fuentes consultadas",en:"Sources consulted"},"STF · íntegra da cautelar de 12/11/2026":{es:"STF · texto íntegro de la cautelar del 12/11/2026",en:"STF · full interim ruling of 12 Nov 2026"},"Senado · EC 141/2026":{es:"Senado · EC 141/2026",en:"Senate · EC 141/2026"},"Câmara · CLT compilada":{es:"Cámara · CLT compilada",en:"Chamber of Deputies · consolidated CLT"},"Câmara · Lei do Trabalho Rural":{es:"Cámara · Ley del Trabajo Rural",en:"Chamber of Deputies · Rural Labour Act"},"CNC · referência de experiência e simulação":{es:"CNC · referencia de experiencia y simulación",en:"CNC · user experience and simulation reference"},"MTE · trabalho em tempo parcial":{es:"MTE · trabajo a tiempo parcial",en:"MTE · part-time work"},"MTE · negociação coletiva e insalubridade":{es:"MTE · negociación colectiva e insalubridad",en:"MTE · collective bargaining and unhealthy working conditions"},"Interface e motor próprios, inspirados na praticidade da CNC. Sem vínculo institucional ou reprodução do código da entidade.":{es:"Interfaz y motor propios, inspirados en la facilidad de uso de la CNC. Sin vínculo institucional ni reproducción de su código.",en:"Our own interface and engine, inspired by CNC’s ease of use. No institutional affiliation or reproduction of its code."},"Prazo indeterminado":{es:"Duración indefinida",en:"Indefinite term"},"Contrato de safra":{es:"Contrato de cosecha",en:"Harvest contract"},"Avaliar contratação rural por pequeno prazo":{es:"Evaluar contratación rural de corta duración",en:"Consider a short-term rural contract"},"Avaliar prazo determinado com causa válida":{es:"Evaluar duración determinada con causa válida",en:"Consider a fixed-term contract with valid grounds"},"CONTRATAÇÃO RURAL":{es:"CONTRATACIÓN RURAL",en:"RURAL HIRING"},"Comece pela necessidade real.":{es:"Empiece por la necesidad real.",en:"Start with the actual need."},"A modalidade contratual e a jornada são decisões diferentes. Uma safra não dispensa registro, salário, repousos ou proteção à saúde.":{es:"La modalidad contractual y la jornada son decisiones diferentes. Una cosecha no exime de registro, salario, descansos ni protección de la salud.",en:"Contract type and working hours are separate decisions. A harvest does not remove registration, salary, rest or health protection requirements."},"Orientador de contratação":{es:"Orientador de contratación",en:"Hiring guide"},"Quem contrata?":{es:"¿Quién contrata?",en:"Who is hiring?"},"Pessoa jurídica":{es:"Persona jurídica",en:"Legal entity"},"Produtor rural pessoa física":{es:"Productor rural persona física",en:"Individual rural producer"},"Qual é a necessidade?":{es:"¿Cuál es la necesidad?",en:"What is the need?"},"Atividade permanente e contínua":{es:"Actividad permanente y continua",en:"Permanent, continuous activity"},"Atividade ligada à variação estacional / safra":{es:"Actividad vinculada a variación estacional / cosecha",en:"Activity linked to seasonal variation / harvest"},"Demanda temporária sem vínculo com safra":{es:"Demanda temporal no vinculada a la cosecha",en:"Temporary demand unrelated to harvest"},"Duração estimada":{es:"Duración estimada",en:"Estimated duration"},meses:{es:"meses",en:"months"},"Pequeno prazo já utilizado no período de um ano":{es:"Corta duración ya utilizada en un período de un año",en:"Short-term period already used within one year"},"Necessidade de até 30 horas por semana":{es:"Necesidad de hasta 30 horas semanales",en:"Need for up to 30 hours per week"},"Revise a duração e o período anterior.":{es:"Revise la duración y el período anterior.",en:"Review the duration and prior period."},"HIPÓTESE PARA REVISÃO":{es:"HIPÓTESIS PARA REVISIÓN",en:"OPTION FOR REVIEW"},"Necessidade contínua aponta para vínculo sem termo final.":{es:"Una necesidad continua apunta a una relación sin término final.",en:"A continuous need points to employment without a fixed end date."},"A duração deve decorrer das variações estacionais da atividade agrária, com justificativa documentada.":{es:"La duración debe derivar de las variaciones estacionales de la actividad agraria, con justificación documentada.",en:"The duration must follow seasonal variations in agricultural activity, with documented justification."},"A hipótese é restrita ao produtor rural pessoa física e à atividade temporária. Confirme os períodos exatos por calendário; estimativa em meses não valida o limite.":{es:"Esta hipótesis se limita al productor rural persona física y a la actividad temporal. Confirme los períodos exactos por calendario; una estimación en meses no valida el límite.",en:"This option is restricted to individual rural producers and temporary activity. Confirm exact calendar periods; an estimate in months does not validate the limit."},"Documente a causa temporária. Ser pessoa jurídica ou ultrapassar o pequeno prazo não autoriza, por si só, outro contrato a termo.":{es:"Documente la causa temporal. Ser persona jurídica o superar el plazo corto no autoriza por sí solo otro contrato de duración determinada.",en:"Document the temporary grounds. Being a legal entity or exceeding the short-term limit does not, by itself, authorize another fixed-term contract."},"Jornada parcial:":{es:"Jornada parcial:",en:"Part-time working hours:"},"avaliar até 30h sem extras ou até 26h com até 6h suplementares. Para empregados atuais, conferir a via coletiva de opção. O simulador de custos usa novas admissões.":{es:"evaluar hasta 30h sin extras o hasta 26h con hasta 6h suplementarias. Para empleados actuales, verifique la vía colectiva de opción. El simulador de costes utiliza nuevas contrataciones.",en:"consider up to 30h without overtime, or up to 26h with up to 6 additional hours. For existing employees, check the collective route for opting in. The cost simulator assumes new hires."},"LEI 5.889/1973":{es:"LEY 5.889/1973",en:"ACT 5.889/1973"},"Pequeno prazo tem limite":{es:"La corta duración tiene límite",en:"Short-term contracts have a limit"},"Exclusivo do produtor rural pessoa física para atividade temporária. Superar dois meses em um ano converte o vínculo em prazo indeterminado. Não é uma autorização geral para contratar sem formalização.":{es:"Exclusivo del productor rural persona física para actividad temporal. Superar dos meses en un año convierte la relación en indefinida. No es una autorización general para contratar sin formalización.",en:"Exclusively for individual rural producers and temporary activity. Exceeding two months in one year converts the relationship to indefinite employment. This is not a general authorization to hire informally."},"Art. 14-A":{es:"Art. 14-A",en:"Article 14-A"},"TRABALHO NO CAMPO":{es:"TRABAJO EN EL CAMPO",en:"RURAL WORK"},"Regras específicas continuam":{es:"Las reglas específicas continúan",en:"Specific rules still apply"},"No rural, conferir intervalos conforme usos e costumes, repouso entre jornadas e trabalho noturno. Lavoura: 21h–5h; pecuária: 20h–4h, com adicional de 25%. O custo noturno não está incluído neste motor.":{es:"En el campo, verifique las pausas según usos y costumbres, el descanso entre jornadas y el trabajo nocturno. Agricultura: 21h–5h; ganadería: 20h–4h, con recargo del 25%. El coste nocturno no está incluido en este motor.",en:"For rural work, check breaks under local practices, rest between shifts and night work. Crop farming: 21:00–05:00; livestock: 20:00–04:00, with a 25% premium. Night work costs are not included in this engine."},"Arts. 5º e 7º":{es:"Arts. 5 y 7",en:"Articles 5 and 7"},"Documentos e decisões para conferir":{es:"Documentos y decisiones que verificar",en:"Documents and decisions to check"},"Enquadramento do empregador, atividade e sindicato competente.":{es:"Encuadramiento del empleador, actividad y sindicato competente.",en:"Employer classification, activity and relevant union."},"Causa e duração do contrato, histórico de admissões e registro.":{es:"Causa y duración del contrato, historial de contrataciones y registro.",en:"Contract grounds and duration, hiring history and registration."},"Salário, piso aplicável, adicionais e condições da norma coletiva.":{es:"Salario, mínimo aplicable, recargos y condiciones de la norma colectiva.",en:"Salary, applicable wage floor, premiums and collective agreement terms."},"Jornada, intervalos, ponto, repousos e eventual compensação.":{es:"Jornada, pausas, control horario, descansos y eventual compensación.",en:"Working hours, breaks, time tracking, rest and any compensation arrangements."},"Condições de SST, exames ocupacionais e riscos da função.":{es:"Condiciones de SST, exámenes ocupacionales y riesgos del puesto.",en:"Occupational health and safety conditions, medical examinations and role risks."},"Comparação das opções":{es:"Comparación de opciones",en:"Comparing the options"},Modalidade:{es:"Modalidad",en:"Type"},"Quando avaliar":{es:"Cuándo evaluar",en:"When to consider"},"Ponto decisivo":{es:"Punto decisivo",en:"Key consideration"},Indeterminado:{es:"Indefinido",en:"Indefinite"},"Necessidade contínua":{es:"Necesidad continua",en:"Continuous need"},"Sem termo final predefinido":{es:"Sin término final predefinido",en:"No predefined end date"},Safra:{es:"Cosecha",en:"Harvest"},"Variação estacional agrária":{es:"Variación estacional agraria",en:"Agricultural seasonal variation"},"Término vinculado à safra":{es:"Finalización vinculada a la cosecha",en:"End tied to the harvest"},"Pequeno prazo rural":{es:"Corta duración rural",en:"Short-term rural"},"Temporário, por produtor PF":{es:"Temporal, por productor persona física",en:"Temporary, hired by an individual producer"},"Limite acumulado no período de um ano":{es:"Límite acumulado en un período de un año",en:"Cumulative limit within one year"},"Tempo parcial":{es:"Tiempo parcial",en:"Part-time"},"Necessidade semanal reduzida":{es:"Necesidad semanal reducida",en:"Reduced weekly need"},"Regime de jornada; não é causa de contrato a termo":{es:"Régimen de jornada; no es causa de contrato a término",en:"Working time arrangement; not grounds for a fixed-term contract"},Intermitente:{es:"Intermitente",en:"Intermittent"},"Alternância real de atividade e inatividade":{es:"Alternancia real de actividad e inactividad",en:"Actual alternation between activity and inactivity"},"Exige análise própria e contrato escrito; sem estimativa automática":{es:"Requiere análisis propio y contrato escrito; sin estimación automática",en:"Requires separate assessment and a written contract; no automatic estimate"},"Lei 5.889/1973":{es:"Ley 5.889/1973",en:"Act 5.889/1973"},"CLT, arts. 443, 452-A e 58-A":{es:"CLT, arts. 443, 452-A y 58-A",en:"CLT, articles 443, 452-A and 58-A"},"MÉTODO E TRANSPARÊNCIA":{es:"MÉTODO Y TRANSPARENCIA",en:"METHOD AND TRANSPARENCY"},"Você vê o resultado. E as premissas.":{es:"Usted ve el resultado. Y los supuestos.",en:"See the result. And the assumptions."},"O sistema separa capacidade contratada, cobertura nos horários necessários e referências econômicas. O cálculo trabalha com minutos inteiros, preservando os 24 minutos da regra transitória.":{es:"El sistema separa capacidad contratada, cobertura en los horarios necesarios y referencias económicas. El cálculo trabaja con minutos enteros, preservando los 24 minutos de la regla transitoria.",en:"The system separates contracted capacity, coverage at required times and economic references. Calculations use whole minutes, preserving the transitional rule’s 24 minutes."},"Fórmulas do planejamento":{es:"Fórmulas de planificación",en:"Planning formulas"},"Jornada-alvo":{es:"Jornada objetivo",en:"Target working hours"},"mínimo(jornada atual, limite da etapa)":{es:"mínimo(jornada actual, límite de la etapa)",en:"minimum(current hours, stage limit)"},"Redução contratual":{es:"Reducción contractual",en:"Contracted hours reduction"},"empregados × (jornada atual − jornada-alvo)":{es:"empleados × (jornada actual − jornada objetivo)",en:"employees × (current hours − target hours)"},"Demanda semanal":{es:"Demanda semanal",en:"Weekly demand"},"Σ duração de cada faixa × pessoas simultâneas":{es:"Σ duración de cada franja × personas simultáneas",en:"Σ duration of each time band × simultaneous staff"},"Lacuna da escala":{es:"Brecha del horario",en:"Schedule gap"},"Σ máximo(0, demanda − pessoas trabalhando) / 60":{es:"Σ máximo(0, demanda − personas trabajando) / 60",en:"Σ maximum(0, demand − staff working) / 60"},"Divisor de referência":{es:"Divisor de referencia",en:"Reference divisor"},"jornada-alvo × 5":{es:"jornada objetivo × 5",en:"target hours × 5"},"(lacuna ÷ jornada-alvo) × salário × (1 + encargos)":{es:"(brecha ÷ jornada objetivo) × salario × (1 + cargas)",en:"(gap ÷ target hours) × salary × (1 + payroll charges)"},"arredondar para cima(lacuna ÷ jornada-alvo) × salário × (1 + encargos)":{es:"redondear hacia arriba(brecha ÷ jornada objetivo) × salario × (1 + cargas)",en:"round up(gap ÷ target hours) × salary × (1 + payroll charges)"},"Hora extra estimada":{es:"Hora extra estimada",en:"Estimated overtime"},"lacuna × fator mensal × (salário ÷ divisor) × (1 + adicional HE) × (1 + DSR) × (1 + encargos)":{es:"brecha × factor mensual × (salario ÷ divisor) × (1 + recargo HE) × (1 + DSR) × (1 + cargas)",en:"gap × monthly factor × (salary ÷ divisor) × (1 + overtime premium) × (1 + DSR) × (1 + payroll charges)"},"Percentuais nas fórmulas são divididos por 100. O fator mensal de horas é ajustável e não altera o divisor salarial. DSR é uma aproximação informada pelo usuário; a apuração real depende do calendário e da escala.":{es:"Los porcentajes se dividen por 100 en las fórmulas. El factor mensual de horas es ajustable y no modifica el divisor salarial. DSR es una aproximación indicada por el usuario; el cálculo real depende del calendario y del horario.",en:"Percentages in the formulas are divided by 100. The monthly hours factor is adjustable and does not change the salary divisor. DSR is a user-entered approximation; the actual calculation depends on the calendar and schedule."},"Como a escala é construída":{es:"Cómo se construye el horario",en:"How the schedule is built"},"Para cada empregado, a busca compara horários de entrada em passos de 30 minutos, incluindo as bordas das faixas. Avalia pausas e sete possibilidades de duas folgas consecutivas, escolhendo a que cobre mais minutos demandados. Empates favorecem os horários de maior déficit. Duas rodadas de revisão melhoram o revezamento sem reduzir a cobertura já alcançada. As pausas e a cobertura são calculadas minuto a minuto.":{es:"Para cada empleado, la búsqueda compara entradas en pasos de 30 minutos, incluyendo los extremos de las franjas. Evalúa pausas y siete posibilidades de dos descansos consecutivos, eligiendo la que cubre más minutos requeridos. Los empates favorecen los horarios de mayor déficit. Dos rondas de revisión mejoran la rotación sin reducir la cobertura alcanzada. Las pausas y la cobertura se calculan minuto a minuto.",en:"For each employee, the search compares start times in 30-minute steps, including time-band boundaries. It evaluates breaks and seven possible pairs of consecutive days off, choosing the option covering the most required minutes. Ties favour times with the greatest shortfall. Two review rounds improve rotation without reducing achieved coverage. Breaks and coverage are calculated minute by minute."},"O modelo verifica limites diários e semanais, no máximo cinco dias de início de jornada, 11h entre jornadas e uma janela mínima de 35h de descanso no ciclo semanal repetido. Não adota compensação diferida de repousos. Uma jornada que atravessa a meia-noite é atribuída ao dia de início; seus efeitos sobre o repouso civil exigem revisão.":{es:"El modelo verifica límites diarios y semanales, un máximo de cinco días de inicio de jornada, 11h entre jornadas y una ventana mínima de 35h de descanso en el ciclo semanal repetido. No aplica compensación diferida de descansos. Una jornada que cruza medianoche se atribuye al día de inicio; sus efectos sobre el descanso civil requieren revisión.",en:"The model checks daily and weekly limits, at most five days on which shifts start, 11h between shifts and a minimum 35h rest window in the repeated weekly cycle. It does not apply deferred rest compensation. A shift crossing midnight is assigned to its start day; its effects on calendar-day rest require review."},"Por ser uma heurística conservadora, pode deixar horas sem alocação ou lacunas evitáveis por outra distribuição. Não é uma prova de dimensionamento mínimo e não constitui certificação de conformidade.":{es:"Al ser una heurística conservadora, puede dejar horas sin asignar o brechas evitables mediante otra distribución. No demuestra una dotación mínima ni constituye una certificación de conformidad.",en:"As a conservative heuristic, it may leave unassigned hours or gaps avoidable through another distribution. It does not prove minimum staffing and does not constitute compliance certification."},"O que não está no valor estimado":{es:"Qué no incluye el valor estimado",en:"What the estimate does not include"},"Pisos específicos, benefícios, custo fixo por admissão, recrutamento, substituições, faltas, produtividade, adicionais noturnos, insalubridade, periculosidade, transporte, pausas da atividade rural e liquidação de reflexos. Só entram em “encargos” as parcelas que você efetivamente incluir no percentual, com cuidado para evitar dupla contagem.":{es:"Salarios mínimos específicos, beneficios, coste fijo por contratación, selección, sustituciones, ausencias, productividad, recargos nocturnos, insalubridad, peligrosidad, transporte, pausas de la actividad rural y liquidación de repercusiones. Las “cargas” solo incluyen lo que usted incorpore efectivamente al porcentaje, evitando duplicidades.",en:"Specific wage floors, benefits, fixed hiring costs, recruitment, replacements, absences, productivity, night premiums, unhealthy or hazardous work premiums, transport, rural work breaks and settlement of related amounts. “Payroll charges” include only the items you actually add to the percentage; avoid double counting."},"A contratação parcial e a integral são equivalências de horas. Contratos adicionais não são posicionados no mapa automaticamente. Antes de contratar ou pagar HE, construa e valide a escala complementar.":{es:"La contratación parcial y completa son equivalencias de horas. Los contratos adicionales no se sitúan automáticamente en el mapa. Antes de contratar o pagar horas extras, construya y valide el horario complementario.",en:"Part-time and full-time hiring are hour equivalents. Additional contracts are not automatically placed on the map. Before hiring or paying overtime, build and validate the supplementary schedule."},"Relação com os materiais de origem":{es:"Relación con los materiales de origen",en:"Relationship with source materials"},"A CNC foi usada como referência de organização e comparação. Esta aplicação tem implementação independente e distingue sua estimativa das condições jurídicas. O exemplo “Referência CNC” replica as entradas iniciais para facilitar a comparação, mas usa este motor e pode produzir uma escala diferente.":{es:"La CNC se utilizó como referencia de organización y comparación. Esta aplicación tiene una implementación independiente y distingue su estimación de las condiciones jurídicas. El ejemplo “Referencia CNC” reproduce los datos iniciales para facilitar la comparación, pero utiliza este motor y puede generar un horario diferente.",en:"CNC was used as a reference for organization and comparison. This application is independently implemented and distinguishes its estimate from legal conditions. The “CNC reference” example reproduces the initial inputs to aid comparison, but uses this engine and may produce a different schedule."},Idioma:{es:"Idioma",en:"Language"},Segunda:{es:"Lunes",en:"Monday"},Terça:{es:"Martes",en:"Tuesday"},Quarta:{es:"Miércoles",en:"Wednesday"},Quinta:{es:"Jueves",en:"Thursday"},Sexta:{es:"Vi
